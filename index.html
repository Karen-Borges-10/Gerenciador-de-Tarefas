<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="index_telefone.css">
    <script src="index.js" defer></script>
</head>
<body>
    <header>
        <h1>Gerenciador de Tarefas</h1>
        <a href="formulario.html" id="perfil"><img src="foto_perfil.jpg" alt="Perfil"></a>
    </header>
    <nav id="menu">
        <h3>Situação</h3>

        <button class="filtro-situacao ativo" data-situacao="todas">
            Todas <span class="contador">0</span>
        </button>

        <button class="filtro-situacao" data-situacao="pendente">
            Pendentes <span class="contador">0</span>
        </button>

        <button class="filtro-situacao" data-situacao="concluida">
            Concluídas <span class="contador">0</span>
        </button>


        <h3>Categorias</h3>

        <button class="filtro-categoria ativo" data-categoria="todas">
            Todas <span class="contador">0</span>
        </button>

        <button class="filtro-categoria" data-categoria="estudo">
            Estudo <span class="contador">0</span>
        </button>

        <button class="filtro-categoria" data-categoria="trabalho">
            Trabalho <span class="contador">0</span>
        </button>

        <button class="filtro-categoria" data-categoria="pessoal">
            Pessoal <span class="contador">0</span>
        </button>
    </nav>
    <main>
        <div id="card">

            <h2>Adicionar Nova Tarefa</h2>
            <p>Preencha os dados abaixo para criar uma nova tarefa.</p>

            <form id="informacao">

                <label for="descricao">Descrição</label>
                <input type="text" id="descricao" name="descricao" placeholder="Digite a descrição da tarefa...">

                <label for="categoria">Categoria</label>
                <select id="categoria" name="categoria">
                    <option value="" disabled selected>Selecione uma categoria</option>
                    <option value="estudo">Estudo</option>
                    <option value="trabalho">Trabalho</option>
                    <option value="pessoal">Pessoal</option>  
                </select>
                
                    <label id="prioridade">Prioridade</label>
                    
                    <div id="opcoes-prioridade">
                        <label  for="alta"><input type="radio" id="alta" name="prioridade" value="alta"> <span class="bolinha alta"></span>Alta</label>

                        
                        <label for="media"><input type="radio" id="media" name="prioridade" value="media"> <span class="bolinha media"></span>Média</label>

                        
                        <label for="baixa"><input type="radio" id="baixa" name="prioridade" value="baixa"> <span class="bolinha baixa"></span>Baixa</label>

                    </div>
                    <label for="conclusao">Data de conclusão</label>
                    <input type="date" id="conclusao" name="conclusao">

                <button id="adicionar">+ Adicionar Tarefa</button>
            </form>
        </div>
        <section id="lista-tarefas">
            <!-- O JavaScript vai colocar as tarefas aqui -->
        </section>
    </main>
</body>
</html>
