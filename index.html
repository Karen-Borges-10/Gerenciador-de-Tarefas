<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
    <script src="index.js" defer></script>
</head>
<body>
    <header>
        <h1>Gerenciador de Tarefas</h1>
    </header>
    <main>
        <div id="card">

            <h3>Cadastro de Tarefas</h3>

            <form id="informacao">

                <label for="Descricao">Descrição:</label>
                <input type="text" id="descricao" name="descricao">

                <label for="categoria">Categoria:</label>
                <select id="categoria" name="categoria">
                    <option value="estudo">Estudo</option>
                    <option value="trabalho">Trabalho</option>
                    <option value="pessoal">Pessoal</option>  
                </select>
                
                <label id="prioridade" for="prioridade">prioridade:</label>

                    
                    <label  for="alta"><input type="radio" id="alta" name="prioridade">Alta</label>

                    
                    <label for="media"><input type="radio" id="media" name="prioridade">Média</label>

                    
                    <label for="baixa"><input type="radio" id="baixa" name="prioridade">Baixa</label>

                <label for="conclusao">Data de conclusão:</label>
                <input type="date" id="conclusao" name="conclusao">

                <button id="adicionar">Adicionar Tarefa</button>
            </form>
        </div>
    </main>
</body>
</html>
