<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="formulario.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>Gerenciador de Tarefas</h1>
        <a href="formulario.html" id="perfil"><img src="foto_perfil.jpg" alt="Perfil"></a>
    </header>
    <nav id="voltar">
        <a href="index.html">← Voltar para a página principal</a>
    </nav>
    <main>
        <form id="cadastro">
            <div id="card">
                <i class="fa-solid fa-user"></i>
                <h1>Cadastro de Usuário</h1>
                <p>Preencha os dados abaixo para criar sua conta.</p>
            </div>

            <label for="nome">Nome completo</label>
            <div class="campo">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo">
            </div>
            
            <label for="email">E-mail</label>
            <div class="campo">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="email" name="email" placeholder="Digite seu e-mail">
            </div>

            <label for="usuario">Nome de usuário</label>
            <div class="campo">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="usuario" name="usuario" placeholder="Digite seu nome de usuário">
            </div>

            <label for="senha">Senha</label>
            <div class="campo">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha">
            </div>

            <label for="confirmar-senha">Confirmar senha</label>
            <div class="campo">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Confirme sua senha">
            </div>

            <label for="data-nascimento">Data de nascimento</label>
            <div class="campo">
                <i class="fa-solid fa-calendar"></i>
                <input type="date" id="data-nascimento" name="data-nascimento">
            </div>

            <button id="criar-conta" type="submit">Criar Conta</button>
        </form>
    </main>
</body>
</html>
